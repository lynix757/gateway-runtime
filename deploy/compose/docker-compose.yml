services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build:
      context: ../..
    environment:
      BFF_HTTP_ADDR: ":8080"
      BFF_HTTP_PUBLIC_URL: "http://localhost:18080"
      BFF_HTTP_BASE_PATH: ""
      BFF_STORE_BACKEND: "redis"
      BFF_REDIS_URL: "redis://redis:6379/0"
      BFF_REDIS_PREFIX: "rebff-local"
      BFF_POLICY_PROVIDER: "static"
      BFF_POLICY_ROLE_PERMISSIONS: '{"admin":["managed-item.read","storage.upload"]}'
    ports:
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
