apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rebff-slo
spec:
  groups:
    - name: rebff.sli
      rules:
        - record: rebff:sli_requests:rate5m
          expr: |
            sum(rate(rebff_http_requests_total{route!~"GET /health/(live|ready)|GET /metrics"}[5m]))
        - record: rebff:sli_5xx:rate5m
          expr: |
            sum(rate(rebff_http_requests_total{status_class="5xx",route!~"GET /health/(live|ready)|GET /metrics"}[5m]))
        - record: rebff:sli_availability:ratio5m
          expr: |
            1 - (
              rebff:sli_5xx:rate5m
              /
              clamp_min(rebff:sli_requests:rate5m, 0.001)
            )
        - record: rebff:sli_latency_p95:seconds5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(rebff_http_request_duration_seconds_bucket{route!~"GET /health/(live|ready)|GET /metrics"}[5m])
              )
            )

    - name: rebff.error-budget
      rules:
        - alert: ReBFFErrorBudgetFastBurn
          expr: |
            (
              sum(rate(rebff_http_requests_total{status_class="5xx",route!~"GET /health/(live|ready)|GET /metrics"}[5m]))
              /
              clamp_min(sum(rate(rebff_http_requests_total{route!~"GET /health/(live|ready)|GET /metrics"}[5m])), 0.001)
            ) / 0.001 > 14.4
            and
            (
              sum(rate(rebff_http_requests_total{status_class="5xx",route!~"GET /health/(live|ready)|GET /metrics"}[1h]))
              /
              clamp_min(sum(rate(rebff_http_requests_total{route!~"GET /health/(live|ready)|GET /metrics"}[1h])), 0.001)
            ) / 0.001 > 14.4
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "rebff is burning the 99.9% availability error budget rapidly"

        - alert: ReBFFErrorBudgetSlowBurn
          expr: |
            (
              sum(rate(rebff_http_requests_total{status_class="5xx",route!~"GET /health/(live|ready)|GET /metrics"}[30m]))
              /
              clamp_min(sum(rate(rebff_http_requests_total{route!~"GET /health/(live|ready)|GET /metrics"}[30m])), 0.001)
            ) / 0.001 > 6
            and
            (
              sum(rate(rebff_http_requests_total{status_class="5xx",route!~"GET /health/(live|ready)|GET /metrics"}[6h]))
              /
              clamp_min(sum(rate(rebff_http_requests_total{route!~"GET /health/(live|ready)|GET /metrics"}[6h])), 0.001)
            ) / 0.001 > 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "rebff is steadily consuming the 99.9% availability error budget"

        - alert: ReBFFSLOP95Latency
          expr: rebff:sli_latency_p95:seconds5m > 0.3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "rebff P95 latency is above the starter 300ms target"
