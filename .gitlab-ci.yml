stages:
  - validate
  - security
  - build

default:
  interruptible: true

go-verify:
  stage: validate
  image: golang:1.27.1-bookworm
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/go-build
      - .cache/go-mod
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...
    - CGO_ENABLED=1 go test -race ./...

trivy:
  stage: security
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

sbom:
  stage: security
  image:
    name: anchore/syft:v1.52.0
    entrypoint: [""]
  script:
    - syft dir:. -o cyclonedx-json=sbom.cdx.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - sbom.cdx.json

go-build:
  stage: build
  image: golang:1.27.1-bookworm
  script:
    - CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o rebff ./cmd/bff
  artifacts:
    expire_in: 7 days
    paths:
      - rebff
