name: rebff-asset-test

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command:
      - start-dev
      - --import-realm
      - --http-port=18081
      - --hostname=http://keycloak.test:18081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      KC_CACHE: local
    ports:
      - "18081:18081"
    volumes:
      - ../../../../deploy/integration/realm-rebff.json:/opt/keycloak/data/import/realm-rebff.json:ro
    networks:
      default:
        aliases:
          - keycloak.test

  mock-asset-api:
    build:
      context: ../../../..
      dockerfile: examples/asset-portal/Dockerfile.test
    image: rebff-asset-demo:test
    command: ["/usr/local/bin/mock-services"]
    environment:
      MOCK_SERVICE: asset
    ports:
      - "19001:19001"

  mock-storage-api:
    image: rebff-asset-demo:test
    command: ["/usr/local/bin/mock-services"]
    environment:
      MOCK_SERVICE: storage
    ports:
      - "19002:19002"
    depends_on:
      mock-asset-api:
        condition: service_started

  bff:
    image: rebff-asset-demo:test
    command:
      - /bin/sh
      - -ec
      - |
        until curl -fsS http://keycloak.test:18081/realms/rebff/.well-known/openid-configuration >/dev/null; do
          echo "component=bff event=wait dependency=keycloak"
          sleep 1
        done
        exec /usr/local/bin/asset-portal
    environment:
      BFF_HTTP_ADDR: ":8080"
      BFF_HTTP_PUBLIC_URL: "http://localhost:18083"
      BFF_STORE_BACKEND: redis
      BFF_REDIS_URL: "redis://redis:6379/0"
      BFF_REDIS_PREFIX: asset-portal-compose
      BFF_POLICY_PROVIDER: static
      BFF_POLICY_ROLE_PERMISSIONS: '{"admin":["asset.read","storage.upload"],"viewer":["asset.read"]}'
      BFF_POLICY_ROLE_CAPABILITIES: '{"admin":["asset-management"]}'
      BFF_METRICS_ENABLED: "true"
      BFF_AUDIT_ENABLED: "true"
      BFF_ACCESS_LOG_ENABLED: "true"
      BFF_TRACE_ENABLED: "true"
      ASSET_API_URL: "http://mock-asset-api:19001"
      STORAGE_API_URL: "http://mock-storage-api:19002"
      BFF_OIDC_ISSUER: "http://keycloak.test:18081/realms/rebff"
      BFF_OIDC_CLIENT_ID: rebff-bff
      BFF_OIDC_CLIENT_SECRET: rebff-dev-secret
    ports:
      - "18083:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      mock-asset-api:
        condition: service_started
      mock-storage-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 3s
      timeout: 2s
      retries: 30
